<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#141c33" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    /* Continuous background pulse & flow animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitNode {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes floatPod {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes radarWave {
      0% { r: 10px; opacity: 0.8; }
      100% { r: 90px; opacity: 0; }
    }

    .bg-pulse-1 {
      transform-origin: 200px 170px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .bg-pulse-2 {
      transform-origin: 1000px 170px;
      animation: pulseGlow 9s ease-in-out infinite reverse;
    }
    .flow-dash {
      stroke-dasharray: 12, 8;
      animation: flowLine 14s linear infinite;
    }
    .floating-cluster-1 {
      animation: floatPod 5s ease-in-out infinite;
    }
    .floating-cluster-2 {
      animation: floatPod 6s ease-in-out infinite 1.5s;
    }
    .radar-pulse {
      animation: radarWave 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    ]]>
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background (Non-intrusive) -->
  <circle class="bg-pulse-1" cx="180" cy="170" r="140" fill="url(#glowGrad1)" />
  <circle class="bg-pulse-2" cx="1020" cy="170" r="150" fill="url(#glowGrad2)" />

  <!-- Animated Orchestration Interconnect Network (Left & Right Sides) -->
  <g opacity="0.45">
    <!-- Left Pod Cluster Interconnects -->
    <path class="flow-dash" d="M 60 170 C 120 100, 160 240, 240 170" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="flow-dash" d="M 240 170 C 290 120, 140 60, 90 90" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="flow-dash" d="M 90 90 C 130 190, 80 270, 160 260" fill="none" stroke="#60a5fa" stroke-width="1.5" />

    <!-- Right Cluster Interconnects -->
    <path class="flow-dash" d="M 960 170 C 1020 100, 1060 240, 1140 170" fill="none" stroke="#818cf8" stroke-width="1.8" />
    <path class="flow-dash" d="M 1140 170 C 1090 120, 1040 60, 990 90" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <path class="flow-dash" d="M 990 90 C 1030 190, 980 270, 1060 260" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Left Cluster Nodes (Dynamic Radar & Pods) -->
  <g class="floating-cluster-1">
    <!-- Master Radar Node -->
    <circle class="radar-pulse" cx="120" cy="170" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="120" cy="170" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="120" cy="170" r="6" fill="#38bdf8" />

    <!-- Worker Nodes -->
    <rect x="70" y="70" width="36" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.8" />
    <text x="88" y="93" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">K8s</text>

    <rect x="210" y="150" width="36" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <text x="228" y="173" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pod</text>

    <rect x="140" y="240" width="36" height="36" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8" />
    <text x="158" y="263" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">k3s</text>
  </g>

  <!-- Right Cluster Nodes -->
  <g class="floating-cluster-2">
    <!-- Master Radar Node -->
    <circle class="radar-pulse" cx="1080" cy="170" r="12" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1080" cy="170" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="1080" cy="170" r="6" fill="#c084fc" />

    <!-- Worker Nodes -->
    <rect x="970" y="70" width="38" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.8" />
    <text x="989" y="93" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Helm</text>

    <rect x="1030" y="240" width="46" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.8" />
    <text x="1053" y="263" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Swarm</text>

    <rect x="940" y="150" width="40" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <text x="960" y="173" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Argo</text>
  </g>

  <!-- Foreground Content: Header, Badges, Title & Subtitles -->
  <!-- Center Backdrop Plate for complete contrast and readability -->
  <rect x="300" y="35" width="600" height="270" rx="14" fill="#0b1329" fill-opacity="0.82" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

  <!-- Top Category Pill -->
  <g transform="translate(600, 75)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
    <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ CLOUD NATIVE &amp; ORCHESTRATION</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="142" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
    Awesome Container Orchestration
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" text-anchor="middle">
    Curated SaaS Platforms, Managed Kubernetes &amp; Open-Source Engines
  </text>

  <!-- Tags / Capabilities Row -->
  <g transform="translate(600, 235)">
    <!-- Tag 1 -->
    <rect x="-240" y="-13" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="-192" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>

    <!-- Tag 2 -->
    <rect x="-135" y="-13" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="-92" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐳 Docker</text>

    <!-- Tag 3 -->
    <rect x="-40" y="-13" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="8" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ Multi-Cloud</text>

    <!-- Tag 4 -->
    <rect x="65" y="-13" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="108" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 GitOps</text>

    <!-- Tag 5 -->
    <rect x="160" y="-13" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="202" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Edge K8s</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="420" y1="280" x2="780" y2="280" stroke="#334155" stroke-width="1" stroke-dasharray="6, 6" />
</svg>
